                    "because": "The Laravel binding is the tier where the popcorn coupling rides: it wires the framework-free @namespace grammar (schemastud/php-json-ns) into the popcorn InvocableRegistry (rushing/php-popcorn) as a URI-keyed dispatch socket. Neither dependency may be dropped — the grammar has no dispatch, the registry has no namespace resolution; this package is exactly their join (asset 06 §8)."
